
name: Build ROSTO Photo Pro APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Extract project
        run: |
          unzip -o RostoPhotoPro.zip -d .
          test -f RostoPhotoPro/settings.gradle.kts
          test -f RostoPhotoPro/app/build.gradle.kts

      - name: Configure AndroidX and Gradle memory
        working-directory: RostoPhotoPro
        run: |
          touch gradle.properties
          sed -i '/^org.gradle.jvmargs=/d' gradle.properties
          sed -i '/^android.useAndroidX=/d' gradle.properties
          sed -i '/^android.enableJetifier=/d' gradle.properties
          echo 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> gradle.properties
          echo 'android.useAndroidX=true' >> gradle.properties
          echo 'android.enableJetifier=true' >> gradle.properties
          echo 'org.gradle.parallel=false' >> gradle.properties
          echo 'org.gradle.workers.max=2' >> gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        working-directory: RostoPhotoPro
        run: gradle --no-daemon --max-workers=2 --stacktrace assembleDebug

      - name: Verify APK
        run: |
          APK=$(find RostoPhotoPro/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)
          test -n "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ROSTO-Photo-Pro-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 7
