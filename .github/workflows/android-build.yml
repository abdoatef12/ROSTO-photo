
      - name: Fix Kotlin version
        working-directory: RostoPhotoPro
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = list(Path(".").rglob("*.gradle"))
          files += list(Path(".").rglob("*.gradle.kts"))
          files += list(Path(".").rglob("libs.versions.toml"))

          for file in files:
              text = file.read_text(encoding="utf-8")
              original = text

              text = re.sub(
                  r'(?i)(kotlinVersion\s*=\s*["\x27])1\.9\.20(["\x27])',
                  r'\g<1>1.9.21\2', text
              )
              text = re.sub(
                  r'(?i)(kotlin\s*=\s*["\x27])1\.9\.20(["\x27])',
                  r'\g<1>1.9.21\2', text
              )
              text = text.replace(
                  'org.jetbrains.kotlin.android" version "1.9.20"',
                  'org.jetbrains.kotlin.android" version "1.9.21"'
              )
              text = text.replace(
                  'org.jetbrains.kotlin.jvm" version "1.9.20"',
                  'org.jetbrains.kotlin.jvm" version "1.9.21"'
              )

              if text != original:
                  file.write_text(text, encoding="utf-8")
                  print(f"Updated: {file}")
          PY
