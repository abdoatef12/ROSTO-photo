
name: Build ROSTO Photo Pro APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PROJECT_DIR: RostoPhotoPro-unpacked/RostoPhotoPro
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify project
        shell: bash
        run: |
          set -e
          test -d "$PROJECT_DIR/app"
          test -f "$PROJECT_DIR/settings.gradle.kts" || test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle.kts" || test -f "$PROJECT_DIR/build.gradle"
          echo "Project directory verified."

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Configure AndroidX and Kotlin
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          touch gradle.properties

          if grep -q '^android.useAndroidX=' gradle.properties; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' gradle.properties
          else
            echo 'android.useAndroidX=true' >> gradle.properties
          fi

          if grep -q '^android.enableJetifier=' gradle.properties; then
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' gradle.properties
          else
            echo 'android.enableJetifier=true' >> gradle.properties
          fi

          if [ -f build.gradle.kts ]; then
            sed -i 's/version "1\.9\.20"/version "1.9.21"/g' build.gradle.kts
          fi

          if [ -f app/build.gradle.kts ]; then
            sed -i 's/version "1\.9\.20"/version "1.9.21"/g' app/build.gradle.kts
          fi

          cat gradle.properties

      - name: Install Gradle 8.2.1
        shell: bash
        run: |
          set -e
          curl -fL --retry 3 \
            https://services.gradle.org/distributions/gradle-8.2.1-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.2.1/bin/gradle" --version

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          "$RUNNER_TEMP/gradle-8.2.1/bin/gradle" \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            assembleDebug

      - name: Find APK
        id: find_apk
        shell: bash
        run: |
          set -e
          APK_PATH="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "APK file was not generated."
            find "$PROJECT_DIR" -type f -name '*.apk' -print
            exit 1
          fi

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "APK generated: $APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ROSTO-Photo-Pro-debug-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
