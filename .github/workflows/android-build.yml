
name: Build ROSTO Photo Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PROJECT_DIR: RostoPhotoPro-unpacked/RostoPhotoPro
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project directory
        shell: bash
        run: |
          set -e
          echo "Checking project files..."
          find . -maxdepth 5 \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: Android project not found at $PROJECT_DIR"
            echo "Check the ZIP extraction path and repository structure."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools not found:"
            echo "$SDKMANAGER"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Configure Gradle and Kotlin versions
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          # Android Gradle Plugin 8.2.0 requires Gradle 8.2 or newer.
          # Use the compatible Gradle 8.2.1 distribution.
          # Kotlin 1.9.21 matches Compose Compiler 1.5.7.
          sed -i \
            's/version "1\.9\.20"/version "1.9.21"/g' \
            build.gradle.kts

          echo "Root build configuration:"
          cat build.gradle.kts

      - name: Download Gradle 8.2.1
        shell: bash
        run: |
          set -e

          curl -fL --retry 3 \
            "https://services.gradle.org/distributions/gradle-8.2.1-bin.zip" \
            -o "$RUNNER_TEMP/gradle-8.2.1-bin.zip"

          unzip -q \
            "$RUNNER_TEMP/gradle-8.2.1-bin.zip" \
            -d "$RUNNER_TEMP"

          "$RUNNER_TEMP/gradle-8.2.1/bin/gradle" --version

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          "$RUNNER_TEMP/gradle-8.2.1/bin/gradle" \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --max-workers=2 \
            assembleDebug

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -e

          APK_PATH="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR" -type f -name '*.apk' -print
            exit 1
          fi

          echo "Found APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROSTO-Photo-Pro-debug-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
