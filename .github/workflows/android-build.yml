
name: Build ROSTO Photo Pro APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Extract project
        run: |
          unzip -o RostoPhotoPro.zip -d .
          test -f RostoPhotoPro/settings.gradle.kts
          test -f RostoPhotoPro/build.gradle.kts
          test -f RostoPhotoPro/app/build.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        working-directory: RostoPhotoPro
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          test -f RostoPhotoPro/app/build/outputs/apk/debug/app-debug.apk
          ls -lh RostoPhotoPro/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ROSTO-Photo-Pro-APK
          path: RostoPhotoPro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
