
name: Extract Project and Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract all project files
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 2 -type f -iname 'RostoPhotoPro.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: RostoPhotoPro.zip not found."
            exit 1
          fi

          mkdir -p RostoPhotoPro-unpacked
          unzip -o "$ZIP" -d RostoPhotoPro-unpacked

          SETTINGS="$(find RostoPhotoPro-unpacked -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No Gradle project found inside ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project files extracted:"
          find RostoPhotoPro-unpacked -type f | head -200

      - name: Upload extracted project files to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add RostoPhotoPro-unpacked

          if ! git diff --cached --quiet; then
            git commit -m "Extract ROSTO Photo Android project [skip ci]"
            git push origin HEAD:main
          fi

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configure Gradle memory
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          touch gradle.properties
          grep -q '^android.useAndroidX=' gradle.properties || \
            echo 'android.useAndroidX=true' >> gradle.properties
          echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> gradle.properties
          echo 'org.gradle.workers.max=2' >> gradle.properties
          echo 'org.gradle.parallel=false' >> gradle.properties

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --max-workers=2 assembleDebug
          else
            gradle --no-daemon --max-workers=2 assembleDebug
          fi

      - name: Verify APK
        shell: bash
        run: |
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/ROSTO-Photo.apk
          ls -lh output/ROSTO-Photo.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ROSTO-Photo-APK
          path: output/ROSTO-Photo.apk
          if-no-files-found: error
          retention-days: 7
