
name: Build ROSTO Photo Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PROJECT_DIR: RostoPhotoPro-unpacked/RostoPhotoPro
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android project
        shell: bash
        run: |
          set -e
          test -d "$PROJECT_DIR/app"
          test -f "$PROJECT_DIR/settings.gradle.kts" || \
            test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle.kts" || \
            test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          echo "Android project verified."

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found: $SDKMANAGER"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Configure Gradle memory and AndroidX
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          touch gradle.properties

          set_property() {
            KEY="$1"
            VALUE="$2"
            FILE="gradle.properties"

            if grep -qE "^${KEY}=" "$FILE"; then
              sed -i "s|^${KEY}=.*|${KEY}=${VALUE}|" "$FILE"
            else
              printf '%s=%s\n' "$KEY" "$VALUE" >> "$FILE"
            fi
          }

          set_property "android.useAndroidX" "true"
          set_property "android.enableJetifier" "true"
          set_property "org.gradle.jvmargs" "-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          set_property "org.gradle.parallel" "false"
          set_property "org.gradle.workers.max" "2"
          set_property "kotlin.daemon.jvmargs" "-Xmx2g"

          echo "Gradle properties configured:"
          cat gradle.properties

      - name: Fix launcher icon reference
        shell: bash
        run: |
          set -e
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          sed -i \
            's|@mipmap/ic_launcher|@android:drawable/sym_def_app_icon|g' \
            "$MANIFEST"

          echo "Launcher icon reference checked."

      - name: Install Gradle 8.2.1
        shell: bash
        run: |
          set -e

          curl -fL --retry 3 \
            "https://services.gradle.org/distributions/gradle-8.2.1-bin.zip" \
            -o "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" \
            -d "$RUNNER_TEMP"

          "$RUNNER_TEMP/gradle-8.2.1/bin/gradle" --version

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          "$RUNNER_TEMP/gradle-8.2.1/bin/gradle" \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            assembleDebug

      - name: Verify APK output
        id: find_apk
        shell: bash
        run: |
          set -e

          APK_PATH="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -maxdepth 1 -type f -name '*.apk' -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Debug APK was not generated."
            find "$PROJECT_DIR" -type f -name '*.apk' -print
            exit 1
          fi

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_PATH"
          echo "APK successfully generated."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROSTO-Photo-Pro-debug-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
